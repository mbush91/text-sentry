name: Android CI & prerelease
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality / tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon :app:testSideloadDebugUnitTest :app:testPlayDebugUnitTest :app:lintSideloadDebug :app:lintPlayDebug :app:assembleSideloadDebug :app:assemblePlayDebug :app:bundlePlayRelease
      - name: Audit Play permissions in built APK
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          PLAY_APK="app/build/outputs/apk/play/debug/app-play-debug.apk"
          test -s "$PLAY_APK"
          "$AAPT" dump permissions "$PLAY_APK" > play-permissions.txt
          if grep -E 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|WRITE_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH|READ_CALL_LOG|WRITE_CALL_LOG|PROCESS_OUTGOING_CALLS)' play-permissions.txt; then
            echo "::error::Play APK declares restricted SMS/call-log permissions."
            exit 1
          fi
      - name: Upload sideload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: TextSentry-sideload-debug-apk
          path: app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Play preview APK
        uses: actions/upload-artifact@v7
        with:
          name: TextSentry-play-preview-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
  instrumentation:
    name: Android emulator / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        name: Run emulator tests
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew --no-daemon :app:connectedSideloadDebugAndroidTest :app:connectedPlayDebugAndroidTest
      - name: Instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
  live-typesafe:
    name: TypeSafe live API smoke test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [quality, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Test live Jev API contract (synthetic SMS only)
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          if [[ -z "$TYPESAFE_AI_API_KEY" ]]; then
            echo "::error::Missing TYPESAFE_AI_API_KEY secret."
            exit 1
          fi
          ./gradlew --no-daemon :app:testSideloadDebugUnitTest --tests "org.textsentry.app.SystemOneLiveTest"

  prerelease:
    name: Signed APK / prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, instrumentation, live-typesafe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Check optional signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$PASSWORD" || -z "$ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Signing secrets not yet configured. Signed prerelease postponed; debug APK is available as a CI artifact."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/textsentry-release.jks"
          chmod 600 "$RUNNER_TEMP/textsentry-release.jks"
      - name: Build signed release
        if: steps.signing.outputs.enabled == 'true'
        env:
          # Paid access is enforced by AWS; allow sideload users to subscribe.
          # Play flavor still compiles WEB_CHECKOUT_ENABLED=false with no hosted checkout.
          TEXTSENTRY_ENABLE_WEB_CHECKOUT: 'true'
          TEXTSENTRY_WEB_CHECKOUT_URL: 'https://pay.rev.cat/mimrlvpobvqnjikw/'
          APP_SIGNING_STORE_FILE: ${{ runner.temp }}/textsentry-release.jks
          APP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleSideloadRelease :app:bundlePlayRelease
      - name: Verify signed APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK=app/build/outputs/apk/sideload/release/app-sideload-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "TextSentry-0.1.0-build-${GITHUB_RUN_NUMBER}.apk"
          jarsigner -verify app/build/outputs/bundle/playRelease/app-play-release.aab
      - name: Upload signed Play AAB for Play Console
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TextSentry-play-signed-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
      - name: Publish prerelease
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ github.run_number }}
          name: TextSentry 0.1.0 build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: TextSentry-0.1.0-build-${{ github.run_number }}.apk
      # Publish a second, rolling prerelease with a fixed asset name. The static
      # TextSentry website links here; /releases/latest excludes prereleases.
      - name: Update latest signed sideload APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_apk="TextSentry-0.1.0-build-${GITHUB_RUN_NUMBER}.apk"
          latest_apk="TextSentry-Android-latest.apk"
          test -s "$build_apk"
          cp "$build_apk" "$latest_apk"
          title="TextSentry latest experimental Android APK (build ${GITHUB_RUN_NUMBER})"
          notes="Rolling signed sideload APK from main, build ${GITHUB_RUN_NUMBER}. Experimental: check permissions and release notes before enabling SMS monitoring. Versioned prereleases remain available."
          if gh release view latest --json tagName >/dev/null 2>&1; then
            gh release upload latest "$latest_apk" --clobber
            gh release edit latest --title "$title" --notes "$notes" --prerelease
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create latest "$latest_apk" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
          fi
          mkdir -p "$RUNNER_TEMP/latest-verify"
          gh release download latest --pattern "$latest_apk" --dir "$RUNNER_TEMP/latest-verify"
          cmp "$latest_apk" "$RUNNER_TEMP/latest-verify/$latest_apk"
