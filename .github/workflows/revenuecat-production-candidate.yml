name: Private production checkout candidate APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revenuecat-production-candidate.yml'

permissions:
  contents: read

concurrency:
  group: textsentry-checkout-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-checkout-candidate:
    name: Build signed private production checkout candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Require production Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$PASSWORD" || -z "$ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more Android signing secrets"
            exit 1
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/textsentry-signing.jks"
          chmod 600 "$RUNNER_TEMP/textsentry-signing.jks"

      - name: Test, lint and assemble production-checkout candidate
        env:
          TEXTSENTRY_ENABLE_WEB_CHECKOUT: 'true'
          TEXTSENTRY_WEB_CHECKOUT_URL: 'https://pay.rev.cat/mimrlvpobvqnjikw/'
          APP_SIGNING_STORE_FILE: ${{ runner.temp }}/textsentry-signing.jks
          APP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$TEXTSENTRY_WEB_CHECKOUT_URL" in
            https://pay.rev.cat/mimrlvpobvqnjikw/) ;;
            *) echo "::error::Production checkout URL mismatch"; exit 1 ;;
          esac
          ./gradlew --no-daemon :app:testSideloadDebugUnitTest :app:testPlayDebugUnitTest :app:lintSideloadDebug :app:lintPlayDebug :app:assembleSideloadRelease :app:bundlePlayRelease
          APK=app/build/outputs/apk/sideload/release/app-sideload-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -m 1 "package: name='org.textsentry.app'"
          cp "$APK" "$RUNNER_TEMP/TextSentry-PRODUCTION-checkout-CANDIDATE.apk"

      - name: Check sideload-only production checkout link
        run: |
          grep -F 'https://pay.rev.cat/mimrlvpobvqnjikw/' app/src/main/java/org/textsentry/app/WebCheckout.java
          grep -F 'Review plans and subscribe' app/src/main/java/org/textsentry/app/SetupActivity.java
          grep -F 'Allow restricted settings' app/src/main/java/org/textsentry/app/SetupActivity.java
          grep -F 'Continue to battery settings' app/src/main/java/org/textsentry/app/SetupActivity.java
          grep -F 'Subscribe to TextSentry' app/src/main/java/org/textsentry/app/AccountActivity.java
          grep -F 'BuildConfig.WEB_CHECKOUT_ENABLED' app/src/main/java/org/textsentry/app/AccountActivity.java
          grep -F 'android:path="/return"' app/src/sideload/AndroidManifest.xml
          grep -F 'WEB_CHECKOUT_ENABLED", "false"' app/build.gradle.kts

      - name: Upload private candidate only — not a GitHub release
        uses: actions/upload-artifact@v7
        with:
          name: TextSentry-PRODUCTION-checkout-CANDIDATE-NOT-PUBLIC
          path: ${{ runner.temp }}/TextSentry-PRODUCTION-checkout-CANDIDATE.apk
          if-no-files-found: error
          retention-days: 7
