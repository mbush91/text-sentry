version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android-toolchain:
        patterns:
          - "com.android.application"
          - "gradle-wrapper"
        update-types:
          - major
      gradle-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # gradle/actions v6 changes caching licensing; needs owner review.
      - dependency-name: gradle/actions
        update-types:
          - version-update:semver-major
